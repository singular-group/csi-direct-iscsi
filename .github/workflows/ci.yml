# Pull requests and pushes to main: vet, tests, and the race detector as root
# (the chroot test). The image is built by the cloud-provider-openstack fork.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          set -eo pipefail
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          sudo env "PATH=$PATH" "HOME=$HOME" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -race -count=1 ./...
